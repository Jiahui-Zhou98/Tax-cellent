version: "3.9"

services:
  backend:
    image: ghcr.io/jiahui-zhou98/tax-cellent-backend:latest
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.containers.internal:11434
      - OCR_MODEL=deepseek-ocr
      - MODEL_A=qwen3:8b
    volumes:
      - /tmp/taxdebate_uploads:/tmp/taxdebate_uploads
      - /tmp/taxdebate_sessions:/tmp/taxdebate_sessions

  frontend:
    image: ghcr.io/jiahui-zhou98/tax-cellent-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
